services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      # Tries mssql-tools18 first (2022 image, sqlcmd requires -C to trust the self-signed
      # certificate) and falls back to mssql-tools if that path doesn't exist in whichever
      # image gets pulled. The api's depends_on waits for this to pass, not just for the
      # container to start — SQL Server takes several seconds to accept connections.
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: NutriMind.API/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      # Enables Swagger UI (Program.cs only maps it when IsDevelopment() is true) so the local
      # API can be explored/tested from a browser and from the mobile app pointing here.
      ASPNETCORE_ENVIRONMENT: Development
      # Program.cs requires these values at startup (throws InvalidOperationException if
      # missing) — there's no .env in the repo by design (it's in .gitignore). Copy
      # ".env.example" to ".env" and fill in real values before "docker-compose up".
      # "db" is the service name above; Docker resolves it as a host via its internal DNS,
      # and it shares the same password as MSSQL_SA_PASSWORD (a single source of truth,
      # with no risk of the API and the database container drifting out of sync).
      ConnectionStrings__DefaultConnection: Server=db,1433;Database=NutriMindDb;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      GeminiSettings__ApiKey: ${GEMINI_API_KEY}
      ResendSettings__ApiKey: ${RESEND_API_KEY}
      ResendSettings__DevRedirectEmail: ${RESEND_DEV_REDIRECT_EMAIL}

volumes:
  mssql_data:
