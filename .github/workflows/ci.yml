name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # NutriMindAI.sln includes NutriMind.Mobile (.NET MAUI: Android/iOS/MacCatalyst/Windows),
      # whose workloads aren't installed on ubuntu-latest. This filter builds and tests the
      # whole backend (Domain, Application, Infrastructure, API, Web) and the tests, without
      # trying to restore Mobile.
      - name: Restore dependencies
        run: dotnet restore NutriMindAI.CI.slnf

      - name: Build
        run: dotnet build NutriMindAI.CI.slnf --no-restore --configuration Release

      - name: Test
        run: dotnet test NutriMindAI.CI.slnf --no-build --configuration Release --verbosity normal
